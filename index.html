<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17120f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kunden-Tagebuch">
<link rel="manifest" href="manifest.json">
<title>Kunden-Tagebuch</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;background:#f6f2ed;color:#211b17;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom)}
main{max-width:700px;margin:auto;padding:18px 0 30px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.title{font-size:27px;font-weight:800}.sub{color:#756b63;font-size:13px;margin-top:3px}
.card{background:#fff;border:1px solid #e7ded5;border-radius:18px;padding:15px;margin-bottom:14px;box-shadow:0 2px 10px #00000008}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}
label{display:block;font-size:12px;font-weight:700;color:#6d625a;margin:0 0 5px}
input,textarea{width:100%;font:inherit;font-size:16px;border:1px solid #d9cec4;border-radius:11px;padding:11px;background:#fff;color:#211b17}
textarea{min-height:70px;resize:vertical}.btn{border:0;border-radius:12px;padding:12px 15px;font-size:16px;font-weight:750;cursor:pointer}.primary{background:#211b17;color:white;width:100%;margin-top:12px}.small{background:#f0e9e2;color:#302720;padding:8px 10px;font-size:13px}.danger{background:#fff0ee;color:#a33127}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#f8f4f0;border-radius:13px;padding:11px}.stat b{display:block;font-size:18px}.stat span{font-size:11px;color:#766b63}
.day{margin-top:18px}.dayhead{display:flex;justify-content:space-between;align-items:end;margin-bottom:8px}.date{font-size:19px;font-weight:800}.end{font-size:13px;color:#655a52;text-align:right}.row{border-top:1px solid #eee6df;padding:12px 0;display:grid;grid-template-columns:1fr auto;gap:7px}.name{font-weight:800}.meta{font-size:12px;color:#776c63;margin-top:3px}.note{font-size:14px;margin-top:5px}.money{text-align:right;font-weight:800}.tip{font-size:12px;color:#6b5d54;margin-top:3px}.actions{display:flex;gap:7px;margin-top:7px}.empty{text-align:center;color:#776d65;padding:20px 5px}
@media(max-width:430px){.grid{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}.stat:last-child{grid-column:1/-1}.title{font-size:24px}}
</style>
</head>
<body>
<main>
  <div class="top"><div><div class="title">Kunden-Tagebuch</div><div class="sub">Kunden, Leistungen, Umsatz & Trinkgeld</div></div></div>

  <section class="card">
    <div class="grid">
      <div><label>Kunde</label><input id="name" placeholder="z. B. Ahmed"></div>
      <div><label>Betrag (€)</label><input id="amount" type="number" inputmode="decimal" step="0.01" min="0" placeholder="25,00"></div>
      <div><label>Trinkgeld (€)</label><input id="tip" type="number" inputmode="decimal" step="0.01" min="0" placeholder="5,00"></div>
      <div><label>Datum</label><input id="date" type="date"></div>
      <div><label>Uhrzeit</label><input id="time" type="time"></div>
      <div class="full"><label>Leistung / Was wurde gemacht?</label><input id="service" placeholder="z. B. Haarschnitt + Bart"></div>
      <div class="full"><label>Notiz (optional)</label><textarea id="note" placeholder="z. B. Kunde zufrieden, nächste Farbe in 6 Wochen"></textarea></div>
    </div>
    <button class="btn primary" id="save">Eintrag speichern</button>
  </section>

  <section class="card">
    <div class="stats">
      <div class="stat"><span>Umsatz</span><b id="total">0,00 €</b></div>
      <div class="stat"><span>Trinkgeld</span><b id="tips">0,00 €</b></div>
      <div class="stat"><span>Insgesamt</span><b id="grand">0,00 €</b></div>
    </div>
  </section>

  <section id="days"></section>
</main>
<script>
const KEY="kunden_tagebuch_v1";
let entries=JSON.parse(localStorage.getItem(KEY)||"[]");
const $=id=>document.getElementById(id);
const euro=n=>new Intl.NumberFormat("de-DE",{style:"currency",currency:"EUR"}).format(n);
function nowFields(){
  const d=new Date(), p=n=>String(n).padStart(2,"0");
  $("date").value=`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
  $("time").value=`${p(d.getHours())}:${p(d.getMinutes())}`;
}
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
function save(){localStorage.setItem(KEY,JSON.stringify(entries));}
function render(){
  const days=$("days"); days.innerHTML="";
  let total=0,tips=0;
  entries.forEach(e=>{total+=e.amount;tips+=e.tip});
  $("total").textContent=euro(total); $("tips").textContent=euro(tips); $("grand").textContent=euro(total+tips);
  const groups={};
  [...entries].sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time)).forEach(e=>(groups[e.date]??=[]).push(e));
  const dates=Object.keys(groups).sort((a,b)=>b.localeCompare(a));
  if(!dates.length){days.innerHTML='<div class="card empty">Noch keine Einträge.<br>Füge oben deinen ersten Kunden hinzu.</div>';return;}
  dates.forEach(date=>{
    const list=groups[date], sum=list.reduce((s,e)=>s+e.amount,0), tip=list.reduce((s,e)=>s+e.tip,0);
    const d=new Date(date+"T12:00:00");
    const label=d.toLocaleDateString("de-DE",{weekday:"long",day:"2-digit",month:"2-digit",year:"numeric"});
    const sec=document.createElement("section"); sec.className="card day";
    sec.innerHTML=`<div class="dayhead"><div class="date">${esc(label)}</div><div class="end">Endsumme<br><b>${euro(sum)}</b> · Trinkgeld ${euro(tip)}</div></div>`;
    list.forEach(e=>{
      const row=document.createElement("div"); row.className="row";
      row.innerHTML=`<div><div class="name">${esc(e.name)}</div><div class="meta">${esc(e.time)} · ${esc(e.service)}</div>${e.note?`<div class="note">${esc(e.note)}</div>`:""}<div class="actions"><button class="btn small" data-edit="${e.id}">Bearbeiten</button><button class="btn small danger" data-del="${e.id}">Löschen</button></div></div><div class="money">${euro(e.amount)}<div class="tip">+ ${euro(e.tip)} Trinkgeld</div></div>`;
      sec.appendChild(row);
    });
    days.appendChild(sec);
  });
  days.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{entries=entries.filter(e=>e.id!==b.dataset.del);save();render();});
  days.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>edit(b.dataset.edit));
}
function clearForm(){["name","amount","tip","service","note"].forEach(id=>$(id).value="");nowFields();}
function edit(id){
  const e=entries.find(x=>x.id===id); if(!e)return;
  $("name").value=e.name;$("amount").value=e.amount;$("tip").value=e.tip;$("date").value=e.date;$("time").value=e.time;$("service").value=e.service;$("note").value=e.note;
  entries=entries.filter(x=>x.id!==id);save();render();window.scrollTo({top:0,behavior:"smooth"});
}
$("save").onclick=()=>{
  const name=$("name").value.trim(), amount=parseFloat($("amount").value), tip=parseFloat($("tip").value||0);
  if(!name){alert("Bitte Kundennamen eingeben.");return}
  if(!Number.isFinite(amount)||amount<0){alert("Bitte einen gültigen Betrag eingeben.");return}
  entries.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),name,amount,tip:Number.isFinite(tip)&&tip>=0?tip:0,date:$("date").value,time:$("time").value,service:$("service").value.trim(),note:$("note").value.trim()});
  save();render();clearForm();
};
nowFields();render();
</script>
</body>
</html>
